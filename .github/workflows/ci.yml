name: build-and-test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  targets:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm-gc, wasm, js, native]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7 # v1.23
        with:
          version: '0.10.20+65efd5b93'
          core-version: '0.10.20+65efd5b93'
      - run: moon version --all
      - run: moon fmt --check
      - run: moon build --target ${{ matrix.target }}
      - run: moon test --target ${{ matrix.target }}
      - run: moon run examples/map --target ${{ matrix.target }}
      - run: moon run examples/game --target ${{ matrix.target }}
      - run: moon run examples/editor --target ${{ matrix.target }}
  upstream-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
      - run: node scripts/generate_oracle.mjs --check
